name: Build Electron App

on:
  push:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 👇 Bun (optional, for consistency)
      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      # 👇 Node REQUIRED for native builds
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild native modules
        run: bunx --no-install electron-rebuild -f

      - name: Build Windows app
        run: bun run dist:win

      - name: Verify repaired runtime contracts
        run: node --test test/odoo-attachment-adapter.test.mjs test/permission-handler.test.mjs test/native-tool-prerequisites.test.mjs test/windows-shell-contract.test.mjs test/runtime-context-isolation.test.mjs test/email-processing-fast-path.test.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/**

  build-linux:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            python3 \
            libssl-dev \
            libx11-dev \
            libxkbfile-dev \
            libsecret-1-dev

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install locked dependencies
        run: bun install --frozen-lockfile

      - name: Rebuild native modules
        run: bunx --no-install electron-rebuild -f

      - name: Build Linux app
        run: bun run dist:linux

      - name: Verify repaired runtime contracts
        run: node --test test/odoo-attachment-adapter.test.mjs test/permission-handler.test.mjs test/native-tool-prerequisites.test.mjs test/windows-shell-contract.test.mjs test/runtime-context-isolation.test.mjs test/email-processing-fast-path.test.mjs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-build
          path: dist/**